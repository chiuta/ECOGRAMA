name: Bug / Eroare
description: Report a defect / Raportează o eroare
body:
  - type: input
    id: version
    attributes: { label: "Version / Versiune (ecograma --version)" }
    validations: { required: true }
  - type: input
    id: platform
    attributes: { label: "Platform / Platformă (OS, CLI)" }
  - type: textarea
    id: steps
    attributes: { label: "Steps to reproduce / Pași de reproducere", description: "The command and the smallest input that shows it. Do not paste secrets or private files." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: "Expected vs actual / Așteptat vs obținut" }
